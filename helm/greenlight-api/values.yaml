eplicaCount: 1

image:
  repository: maheshsinghepc/greenlight-api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 4000
  targetPort: 4000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application specific configuration
app:
  env:
    - name: GREENLIGHT_DB_DSN
      valueFrom:
        secretKeyRef:
          name: greenlight-secrets
          key: database-url
    - name: PORT
      value: "4000"
  
  # Health check configuration
  healthCheck:
    enabled: true
    path: /v1/healthcheck
    initialDelaySeconds: 30
    periodSeconds: 10